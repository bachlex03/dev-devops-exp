apiVersion: v1
kind: Pod
metadata:
  name: multi-pod
spec:
  initContainers:
    - name: init-setup
      image: busybox
      command: ['sh', '-c', 'echo "Setup done" > /work-dir/setup.txt']
      volumeMounts:
        - name: shared-vol
          mountPath: /work-dir
  containers:
    - name: app-container
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-vol
          mountPath: /usr/share/nginx/html
        - name: log-vol
          mountPath: /var/log/nginx
    - name: sidecar-logger
      image: busybox
      command: ['sh', '-c', 'mkdir -p /var/log/nginx && touch /var/log/nginx/access.log && tail -f /var/log/nginx/access.log']
      volumeMounts:
        - name: log-vol
          mountPath: /var/log/nginx
  volumes:
    - name: shared-vol
      emptyDir: {}
    - name: log-vol
      emptyDir: {}