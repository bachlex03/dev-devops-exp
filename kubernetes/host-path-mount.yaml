apiVersion: v1
kind: Pod
metadata:
  name: host-path-demo
spec:
  volumes:
  - name: host-logs
    hostPath:
      path: /var/log
      type: DirectoryOrCreate
  containers:
  - name: log-reader
    image: busybox
    command: ['sh', '-c', 'tail -f /host-logs/syslog && sleep 3600']
    volumeMounts:
    - name: host-logs
      mountPath: /host-logs
      readOnly: true