apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: exam
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: web-ext
  namespace: exam
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
  type: NodePort
