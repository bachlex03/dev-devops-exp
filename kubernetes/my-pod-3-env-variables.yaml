apiVersion: v1
kind: Pod
metadata:
  name: my-pod-3
  labels:
    name: my-pod-3-label
spec:
  containers:
    - name: my-container-3
      image: busybox
      env:
        - name: KEY1
          valueFrom:
            configMapKeyRef:
              name: my-configmap
              key: key1
        - name: password
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: password